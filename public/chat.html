<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sishu Tirtha School Assistant</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --red: #8b1a1a;
            --red-bright: #b22222;
            --navy: #0d1f35;
            --gold: #c8882a;
            --cream: #faf8f4;
            --white: #ffffff;
            --text-dark: #1c2333;
            --text-mid: #2d3a4f;
            --text-soft: #4a5568;
            --border-soft: #e2d9cc;
            --shadow-sm: 0 2px 12px rgba(0,0,0,0.08);
            --shadow-md: 0 8px 32px rgba(0,0,0,0.14);
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--cream);
            display: flex;
            flex-direction: column;
        }

        /* ===== HEADER ===== */
        .chat-header {
            background: linear-gradient(135deg, var(--navy) 0%, #2a3f5f 100%);
            color: white;
            padding: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: var(--shadow-md);
            flex-shrink: 0;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .header-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(200, 136, 42, 0.2);
            border: 2px solid var(--gold);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
        }

        .header-info h2 {
            font-family: 'Playfair Display', serif;
            font-size: 1.1rem;
            margin-bottom: 0.2rem;
            font-weight: 700;
        }

        .header-info p {
            font-size: 0.75rem;
            opacity: 0.8;
            letter-spacing: 0.05em;
        }

        .header-actions {
            display: flex;
            gap: 0.8rem;
        }

        .header-btn {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            font-size: 1rem;
        }

        .header-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.5);
        }

        /* ===== MESSAGES CONTAINER ===== */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            background: var(--cream);
        }

        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: var(--red);
            border-radius: 3px;
        }

        /* Message Bubble - User */
        .message {
            display: flex;
            margin-bottom: 0.5rem;
            animation: slideUp 0.3s ease both;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.bot {
            justify-content: flex-start;
        }

        .message-content {
            max-width: 70%;
            padding: 0.9rem 1.2rem;
            border-radius: 14px;
            font-size: 0.95rem;
            line-height: 1.6;
            word-wrap: break-word;
        }

        .message.user .message-content {
            background: linear-gradient(135deg, var(--red) 0%, var(--red-bright) 100%);
            color: white;
            border-bottom-right-radius: 4px;
            box-shadow: 0 2px 8px rgba(139, 26, 26, 0.2);
        }

        .message.bot .message-content {
            background: white;
            color: var(--text-dark);
            border: 1px solid var(--border-soft);
            border-bottom-left-radius: 4px;
            box-shadow: var(--shadow-sm);
        }

        /* Typing Indicator */
        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 1rem 1.2rem;
            background: white;
            border-radius: 14px;
            border: 1px solid var(--border-soft);
            width: fit-content;
            border-bottom-left-radius: 4px;
            box-shadow: var(--shadow-sm);
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-soft);
            animation: typing 1.4s infinite;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                opacity: 0.5;
                transform: translateY(0);
            }
            30% {
                opacity: 1;
                transform: translateY(-10px);
            }
        }

        /* Welcome Message */
        .welcome-box {
            text-align: center;
            padding: 2rem 1.5rem;
            background: linear-gradient(135deg, rgba(139, 26, 26, 0.05) 0%, rgba(200, 136, 42, 0.05) 100%);
            border-radius: 12px;
            border: 1px solid var(--border-soft);
        }

        .welcome-box h2 {
            font-family: 'Playfair Display', serif;
            color: var(--red);
            font-size: 1.4rem;
            margin-bottom: 0.5rem;
        }

        .welcome-box p {
            color: var(--text-mid);
            font-size: 0.9rem;
            line-height: 1.7;
            margin-bottom: 1rem;
        }

        .quick-prompts {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.8rem;
            margin-top: 1.2rem;
        }

        .quick-prompt {
            background: white;
            border: 1px solid var(--border-soft);
            padding: 0.8rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.80rem;
            color: var(--text-mid);
            transition: all 0.3s ease;
            line-height: 1.5;
        }

        .quick-prompt:hover {
            background: var(--cream);
            border-color: var(--red);
            color: var(--red);
            transform: translateY(-2px);
            box-shadow: var(--shadow-sm);
        }

        /* ===== INPUT AREA ===== */
        .chat-input-area {
            padding: 1.2rem;
            background: white;
            border-top: 1px solid var(--border-soft);
            display: flex;
            gap: 0.8rem;
            flex-shrink: 0;
        }

        .input-wrapper {
            display: flex;
            flex: 1;
            border: 1.5px solid var(--border-soft);
            border-radius: 24px;
            padding: 0 1rem;
            background: white;
            transition: all 0.3s ease;
            align-items: center;
        }

        .input-wrapper:focus-within {
            border-color: var(--red);
            box-shadow: 0 0 0 3px rgba(139, 26, 26, 0.1);
        }

        .input-wrapper input {
            flex: 1;
            border: none;
            outline: none;
            padding: 0.9rem 0;
            font-family: 'Poppins', sans-serif;
            font-size: 0.95rem;
            color: var(--text-dark);
        }

        .input-wrapper input::placeholder {
            color: #aab0bd;
        }

        .send-btn {
            background: linear-gradient(135deg, var(--red) 0%, var(--red-bright) 100%);
            border: none;
            color: white;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            box-shadow: 0 3px 12px rgba(139, 26, 26, 0.3);
            flex-shrink: 0;
        }

        .send-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(139, 26, 26, 0.4);
        }

        .send-btn:active:not(:disabled) {
            transform: scale(0.95);
        }

        .send-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 640px) {
            .chat-header {
                padding: 1rem;
            }

            .header-info h2 {
                font-size: 0.95rem;
            }

            .header-btn {
                width: 36px;
                height: 36px;
                font-size: 0.9rem;
            }

            .chat-messages {
                padding: 1rem;
                gap: 0.8rem;
            }

            .message-content {
                max-width: 85%;
                padding: 0.8rem 1rem;
                font-size: 0.9rem;
            }

            .quick-prompts {
                grid-template-columns: 1fr;
            }

            .chat-input-area {
                padding: 1rem;
                gap: 0.6rem;
            }

            .send-btn {
                width: 40px;
                height: 40px;
                font-size: 1rem;
            }

            .welcome-box {
                padding: 1.5rem 1rem;
            }

            .welcome-box h2 {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <!-- HEADER -->
    <div class="chat-header">
        <div class="header-left">
            <div class="header-avatar">🎓</div>
            <div class="header-info">
                <h2>Sishu Tirtha Assistant</h2>
                <p>Always here to help</p>
            </div>
        </div>
        <div class="header-actions">
            <button class="header-btn" id="refreshBtn" title="Refresh">
                <i class="fas fa-sync-alt"></i>
            </button>
            <button class="header-btn" id="backBtn" title="Go Back">
                <i class="fas fa-arrow-left"></i>
            </button>
        </div>
    </div>

    <!-- MESSAGES AREA -->
    <div class="chat-messages" id="chatMessages">
        <div class="welcome-box">
            <h2>Welcome! 👋</h2>
            <p>I'm your Sishu Tirtha High School assistant. I can help you with:</p>
            <p style="font-size: 0.85rem; margin-top: 0.8rem;">
                ✓ School information & details<br>
                ✓ Admissions & enrollment<br>
                ✓ Facilities & services<br>
                ✓ Contact information
            </p>
            <div class="quick-prompts">
                <button class="quick-prompt" onclick="sendQuickMessage('Tell me about the school')">About the School</button>
                <button class="quick-prompt" onclick="sendQuickMessage('What are the admission requirements?')">Admissions</button>
                <button class="quick-prompt" onclick="sendQuickMessage('What facilities do you have?')">Facilities</button>
                <button class="quick-prompt" onclick="sendQuickMessage('How do I contact the school?')">Contact Info</button>
            </div>
        </div>
    </div>

    <!-- INPUT AREA -->
    <div class="chat-input-area">
        <div class="input-wrapper">
            <input 
                type="text" 
                id="messageInput" 
                placeholder="Ask me anything about Sishu Tirtha High School..." 
                autocomplete="off"
            >
        </div>
        <button class="send-btn" id="sendBtn" title="Send message">
            <i class="fas fa-paper-plane"></i>
        </button>
    </div>

    <script>
        // ========== CHAT FUNCTIONALITY ==========
        
        const chatMessages = document.getElementById('chatMessages');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const backBtn = document.getElementById('backBtn');
        const refreshBtn = document.getElementById('refreshBtn');

        // Store conversation history for context
        let conversationHistory = JSON.parse(localStorage.getItem('chatHistory')) || [];

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            loadChatHistory();
            messageInput.focus();
        });

        // Send message on Enter or button click
        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // Back button - return to main site
        backBtn.addEventListener('click', function() {
            window.location.href = 'index.html';
        });

        // Refresh - clear chat
        refreshBtn.addEventListener('click', function() {
            if (confirm('Clear all messages?')) {
                chatMessages.innerHTML = '';
                conversationHistory = [];
                localStorage.removeItem('chatHistory');
                location.reload();
            }
        });

        function sendMessage() {
            const text = messageInput.value.trim();
            if (!text) return;

            // Add user message to DOM
            addMessageToChat(text, 'user');
            messageInput.value = '';
            messageInput.focus();

            // Store in history
            conversationHistory.push({ role: 'user', content: text });
            localStorage.setItem('chatHistory', JSON.stringify(conversationHistory));

            // Show typing indicator
            showTypingIndicator();

            // Call your AI API with the user message
            getAIResponse(text);
        }

        function addMessageToChat(text, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;
            messageDiv.innerHTML = `<div class="message-content">${escapeHtml(text)}</div>`;
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function showTypingIndicator() {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message bot';
            messageDiv.innerHTML = `
                <div class="typing-indicator">
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                </div>
            `;
            messageDiv.id = 'typingIndicator';
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function removeTypingIndicator() {
            const indicator = document.getElementById('typingIndicator');
            if (indicator) indicator.remove();
        }

        // ========== CALL YOUR AI.JS API HERE ==========
        async function getAIResponse(userMessage) {
            try {
                // Make API call to your backend which uses ai.js
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        question: userMessage,
                        history: conversationHistory
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                removeTypingIndicator();

                // Extract answer from response (adjust based on your API response format)
                const botMessage = data.answer || data.response || data.text || data.data || "No response received";

                addMessageToChat(botMessage, 'bot');
                conversationHistory.push({ role: 'bot', content: botMessage });
                localStorage.setItem('chatHistory', JSON.stringify(conversationHistory));

            } catch (error) {
                console.error('Error calling AI API:', error);
                removeTypingIndicator();
                const errorMsg = "Sorry, I'm having trouble connecting to the AI service. Please try again or contact the school directly at +91 9435372983.";
                addMessageToChat(errorMsg, 'bot');
            }
        }

        function sendQuickMessage(text) {
            messageInput.value = text;
            sendMessage();
        }

        function loadChatHistory() {
            // Load and display previous chat
            if (conversationHistory.length > 0) {
                conversationHistory.forEach(msg => {
                    addMessageToChat(msg.content, msg.role);
                });
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
